<!DOCTYPE html>

<html lang="en">

    <head>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Roboto+Mono&display=swap" rel="stylesheet">

        <link href="/static/styles.css" rel="stylesheet">

        {% block script %}{% endblock %}

        <title>{% block title %}{% endblock%}</title>
    </head>

    <body>
        <div class="background-letters"></div>
        <!--HEADER - different tabs (log in, register/log out; Main page, Profile, Add Friend)-->
        <header>
            {% if session["user_id"] %}
            <nav class="navbar navbar-expand-lg chalk-navbar px-4 py-2">
                <div class="container-fluid d-felx justify-content-between align-items-center">
                    
                    <div class="d-flex align-items-center gap-3">                       
                            <a class="nav-link" href="/profile/{{ logged_in_user }}">Profile</a>
                            <a class="nav-link" href="/search">Add friends</a>                           
                    </div>
                    
                    <div class="text-center flex-grow-1">
                        <a class="navbar-brand game-title-small" href="/">Filler Words</a>
                    </div>
                   
                    
                    <div class="d-flex align-items-center gap-3 position-relative">                          
                        <div class="notification-container position-relative">
                            <button id="notification-btn" class="btn btn-light position-relative">
                            🔔<span id="notification-count" class="badge bg-danger position-absolute top-0 start-100 transtale-middle" style="display: none">0</span>
                            </button>

                            <div id="notification-dropdown" class="dropdown-menu p-2 notification-dropdown-custom">
                                <h6 class="dropdown-header">Invites</h6>
                                <ul id="notification-list" class="list-unstyled mb-0"></ul>
                            </div> 
                        </div>
                        <a class="nav-link" href="/logout">Log out</a></li>
                        
                    </div>                                    
                </div>
            </nav>
            {% endif %}
            
        </header>
        <main>
            {% block main %}

            {% endblock %}
        </main>

        <footer>
            <p>Author: Marcel Roszyk</p>
        </footer>
        <script>
            function fetchNotifications() {
                $.get("/notifications", function (data) {
                    console.log("Fetched notifications:", data);

                    const count = data.length;
                    const $badge = $("#notification-count")
                    const $list = $("#notification-list");

                    if (count > 0) {
                        $badge.text(count).show();
                    } else {
                        $badge.hide();
                    }

                    $list.empty();
                    data.forEach(function (req) {
                        if (req.type === "friend") {
                            $list.append(`
                                <li class="mb-2">
                                    <span>${req.sender_username}</span>
                                    <button class="btn btn-sm btn-success accept-friend" data-id="${req.id}">✔</button>
                                    <button class="btn btn-sm btn-danger decline-friend" data-id="${req.id}">✖</button>
                                </li>
                            `);
                        } else if (req.type === "game") {
                            $list.append(`
                                <li class="mb-2">
                                    <span>${req.sender_username} invited you to a game</span>
                                    <button class="btn btn-sm btn-success accept-game" data-id="${req.id}">✔</button>
                                    <button class="btn btn-sm btn-danger decline-game" data-id="${req.id}">✖</button>
                                </li>
                            `);    
                        }
                    });
                });
            }

            function respondRequest(requestId, action) {
                $.ajax({
                    url: "/respond_request",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ request_id: requestId, action: action }),
                    success: function () {
                        fetchNotifications();
                    }
                });
            }

            $(document).ready(function () {
                fetchNotifications();

                $("#notification-btn").on("click", function () {
                    $("#notification-dropdown").toggle();
                });

                $("#notification-list").on("click", ".accept-friend", function () {
                    const id = $(this).data("id");
                    respondRequest(id, "accept");
                });

                $("#notification-list").on("click", ".decline-friend", function () {
                    const id = $(this).data("id");
                    respondRequest(id, "decline");
                });

                $("#notification-list").on("click", ".accept-game", function () {
                    const id = $(this).data("id");
                    $.ajax({
                        url: "/respond_invite",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ invite_id: id, action: "accept"}),
                        success: function (resp) {
                            if (resp.success && resp.room_id) {
                                window.location.href = `/play/${resp.room_id}`;
                            }
                            else {
                                alert(resp.message || "Invite is no longer valid.");
                                fetchNotifications();
                            }

                        },
                        error: function (xhr) {
                            alert(xhr.responseJSON?.message || "Error responding to invite.");
                            fetchNotifications();
                        }
                    });
                });

                $("#notification-list").on("click", ".decline-game", function () {
                    const id = $(this).data("id");
                    $.ajax({
                        url: "/respond_invite",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ invite_id: id, action: "decline"}),
                        success: function () {
                            fetchNotifications();
                        }
                    });
                });

                setInterval(fetchNotifications, 30000);
            });

            $(document).ready(function () {
                const $bg = $(".background-letters");
                const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const letterCount = 40;

                for (let i = 0; i < letterCount; i++) {
                    const $span = $("<span></span>")
                        .addClass("bg-letter")
                        .text(letters[Math.floor(Math.random() * letters.length)])
                        .css({
                            top: `${Math.random() * 100}%`,
                            left: `${Math.random() * 100}%`,
                            fontSize: `${2 + Math.random() * 3}rem`,
                            transform: `rotate(${Math.random() * 360}deg)`
                        });
                    $bg.append($span);
                }
            });
        </script>

    </body>
</html>
