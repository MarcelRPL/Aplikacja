<!DOCTYPE html>

<html lang="en">

    <head>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <link href="/static/styles.css" rel="stylesheet">

        {% block script %}{% endblock %}

        <title>{% block title %}{% endblock%}</title>
    </head>

    <body>
        <!--HEADER - different tabs (log in, register/log out; Main page, Profile, Add Friend)-->
        <header>
            <nav>
                <div>
                    {% if session["user_id"] %}
                    <ul>
                        <li class="nav-item"><a href="/">NameOfTheGame</a></li>
                        <li class="van-item"><a href="/profile/{{ logged_in_user }}">Profile</a></li>
                        <li class="nav-item"><a href="/search">Add friends</a></li>
                    </ul>
                    <ul>
                        <li class="nav-item"><a href="/logout">Log out</a></li>
                    </ul>
                    <div class="notification-container" style="position: relative">
                    <button id="notification-btn" style="position: relative">
                        🔔<span id="notification-count" class="badge bg-danger" style="position: absolute; top: -5px; right: -10px; display: none">0</span>
                    </button>

                    <div id="notification-dropdown" class="dropdown-menu p-2" style="display: none; position: absolute; right: 0; top: 30px; width: 250px; background: white; border: 1px solid #ccc; z-index: 1000">
                        <h6>Invites</h6>
                        <ul id="notification-list" class="list-unstyled mb-0"></ul>
                    </div>
                </div>
                    {% else %}
                    <ul>
                        <li class="nav-item"><a href="/register">Register</a></li>
                        <li class="nav-item"><a href="/login">Log In</a></li>
                    </ul>
                    {% endif %}
                </div>
            </nav>
            
        </header>
        <main>
            {% block main %}

            {% endblock %}
        </main>

        <footer>
            <p>Author: Marcel Roszyk</p>
        </footer>
        <script>
            function fetchNotifications() {
                $.get("/notifications", function (data) {
                    console.log("Fetched notifications:", data);

                    const count = data.length;
                    const $badge = $("#notification-count")
                    const $list = $("#notification-list");

                    if (count > 0) {
                        $badge.text(count).show();
                    } else {
                        $badge.hide();
                    }

                    $list.empty();
                    data.forEach(function (req) {
                        if (req.type === "friend") {
                            $list.append(`
                                <li class="mb-2">
                                    <span>${req.sender_username}</span>
                                    <button class="btn btn-sm btn-success accept-friend" data-id="${req.id}">✔</button>
                                    <button class="btn btn-sm btn-danger decline-friend" data-id="${req.id}">✖</button>
                                </li>
                            `);
                        } else if (req.type === "game") {
                            $list.append(`
                                <li class="mb-2">
                                    <span>${req.sender_username} invited you to a game</span>
                                    <button class="btn btn-sm btn-success accept-game" data-id="${req.id}">✔</button>
                                    <button class="btn btn-sm btn-danger decline-game data-id="${req.id}">✖</button>
                                </li>
                            `);    
                        }
                    });
                });
            }

            function respondRequest(requestId, action) {
                $.ajax({
                    url: "/respond_request",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ request_id: requestId, action: action }),
                    success: function () {
                        fetchNotifications();
                    }
                });
            }

            $(document).ready(function () {
                fetchNotifications();

                $("#notification-btn").on("click", function () {
                    $("#notification-dropdown").toggle();
                });

                $("#notification-list").on("click", ".accept-friend", function () {
                    const id = $(this).data("id");
                    respondRequest(id, "accept");
                });

                $("#notification-list").on("click", ".decline-friend", function () {
                    const id = $(this).data("id");
                    respondRequest(id, "decline");
                });

                $("#notification-list").on("click", ".accept.game", function () {
                    const id = $(this).data("id");
                    $.ajax({
                        url: "/respond_invite",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ invite_id: id, action: "accept"}),
                        success: function () {
                            fetchNotifications();
                        }
                    });
                });

                $("#notification-list").on("click", ".decline.game", function () {
                    const id = $(this).data("id");
                    $.ajax({
                        url: "/respond_invite",
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ invite_id: id, action: "decline"}),
                        success: function () {
                            fetchNotifications();
                        }
                    });
                });

                setInterval(fetchNotifications, 30000);
            });
        </script>

    </body>
</html>
