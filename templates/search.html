{% extends "layout.html" %}

{% block title %}
Search
{% endblock %}

{% block main %}
<div class="d-flex justify-content-center mt-5">
    <div class="chalk-card p-4 text-light" style="max-width: 500px; width: 100%">
        <h2 class="text-center mb-4">Find Player</h2>
        <form action="/search" method="get" class="d-flex felx-column gap-3">
            <input autofocus name="user" placeholder="Username" type="text" class="form-control input-chalk">
            <button type="submit" class="button-chalk text-center">Search</button>
        </form>
    </div>
</div>

{% endblock %}
