{% extends "layout.html" %}

{% block script %}
<script>
 
</script>
{% endblock %}

{% block title %}
Solo
{% endblock %}

{% block main %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-9 mb-4">
            <div class="chalk-card p-4 text-center">
                <div class="d-flex justify-content-center align-items-center mb-4 felx-wrap gap-3">
                    <div class="fs-4 text-highlight uppercase">{{ start }}_____{{ end }}</div>
                    <div id="timer" class="fs-1 fw-bold text-highlight px-4 py-2 border border-light rounded" style="min-width: 100px;">30</div>
                </div>

                <div class="mt-3">
                    <input id="word" autofocus autocomplete="off" name="word" placeholder="Type your word + Enter" type="text" class="form-control input-chalk text-center" style="max-width: 300px; margin: 0 auto;">
                </div>
            </div>
        </div>
        <div class="col-lg-3">
            <div class="chalk-card p-3">
                <h4 class="text-center">Live Summary</h4>
                <div class="text-highlight text-center mb-2">
                    Score: <span id="score">0</span>
                </div>
                <ul id="guessed_words" class="mt-3" style="list-style: none; padding-left: 0;"></ul>
            </div>
        </div>
    </div>    
</div>

<div id="summary" class="modal hidden">
    <div class="modal-content chalk-card">
        <h2 class="text-center mb-3">Summary</h2>
        <p class="text-center" style="font-weight: bold"><span id="summary-start" class="uppercase"></span>____<span id="summary-end" class="uppercase"></span></p>
        <p class="text-center"><strong>Final score: </strong><span id="summary-score"></span></p>
        <p class="text-center"><strong>Guessed words:</strong></p>
        <ul id="summary-words" class="text-center uppercase"></ul>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="/solo" class="button-chalk">Go again</button></a>
            <a href="/" class="button-chalk">Main menu</button></a>
        </div>
    </div>
</div>
<script>
    let timeLeft = 30;
    let guessedWords = [];
    let totalScore = 0;

    let timer = setInterval(() => {
        timeLeft--;
        $("#timer").text(timeLeft);
        if (timeLeft <= 0) {
            clearInterval(timer);
            $("#word").prop("disabled", true);
            showSummary();
            $.ajax({
                url: "/save_game",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    start: "{{ start }}",
                    end: "{{ end }}",
                    score: totalScore,
                    words: guessedWords
                }),
                success: function(response) {
                    console.log("Game saved");
                }
            });
        }
    }, 1000);


$("#word").on("keypress", function (e) {
    if (e.which === 13) {
        e.preventDefault();
        let word = $(this).val().toLowerCase();
        $.post("/check_word", { word: word }, function (response) {
            if (response.valid) {
                guessedWords.push(response.word);
                totalScore += response.points;

                $("#guessed_words").append(
                    `<li>${response.word} (+${response.points})</li>`
                );
                $("#score").text(totalScore);
            }
            $("#word").val("");
        });
    }  
});

function showSummary() {
    $("#summary-start").text("{{ start }}");
    $("#summary-end").text("{{ end }}");
    $("#summary-score").text(totalScore);

    $("#summary-words").empty();
    for (let word of guessedWords) {
        $("#summary-words").append(`<li>${word}</li>`);
    }

    $("#summary").removeClass("hidden");
};
</script>

{% endblock %}
