{% extends "layout.html" %}

{% block script %}
<script>
    $(document).ready(function () {
        const socket = io();

        const inviteMode = "{{ invite_mode|default(false) }}";
        const roomId = "{{ room_id|default('') }}";
        let room = null;

        if (inviteMode && roomId) {
            // Invited game
            socket.emit("join_game", { room_id: roomId});
        } else {
            // Random matchmaking
            socket.emit("join_game")
        }

        let timeLeft = 30;
        let guessedWords = []

        // Czekanie na drugiego gracza
        socket.on("waiting", function (data) {
            $("#status").text(data.msg);
        });

        // Gra się rozpoczyna
        socket.on("start_game", function (data) {
            room = data.room;
            $("#status").addClass("d-none");
            $("#game").show();

            $("#letters").text(`${data.start_letter}____${data.end_letter}`);

            // Timer 
            let timer = setInterval(() => {
                timeLeft--;
                $("#timer").text(timeLeft);
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    $("#word").prop("disabled", true);
                    $("#submit").prop("disabled", true);
                }
            }, 1000)
        });

        // Akceptowanie słów
        socket.on("word_accepted", function (data) {
            guessedWords.push(data.word);
            $("#guessed_words").append(`<li>${data.word} (+${data.score})</li>`);
            $("#score").text(data.total);
            $("#feedback").text("Word accepted!");
        });

        // Odrzucanie słowa
        socket.on("word_rejected", function (data) {
            $("#feedback").text(`${data.msg}`);
        });

        // Koniec gry - podsumowanie
        socket.on("game_over", function (data) {
            console.log("GAME OVER:", data);
            $("#summary").removeClass("hidden");

            $("#summary-letters").text(`${data.start}___${data.end}`)
            $("#summary-your-score").text(`${data.your_score}`);
            $("#summary-opponent-score").text(`${data.opponent_score}`);
            $("#summary-result").text(`${data.result}`);


            // Twoje słowa
            $("#summary-words").empty();
            for (let word of data.your_words) {
                $("#summary-words").append(`<li>${word}</li>`);
            }

            // Słowa przeciwnika
            $("#summary-opponent-words").empty();
            for (let word of data.opponent_words) {
                $("#summary-opponent-words").append(`<li>${word}</li>`);
            }
        });
        
        // Wprowadzanie słowa
        $("#word").on("keypress", function (e) {
            if (e.which === 13) {
                const word = $(this).val().toLowerCase().trim();
                if (word && room) {
                    socket.emit("submit_word", {
                        word: word,
                        room: room
                    });
                }
                $(this).val("");
            }
        });

        socket.on("opponent_disconnected", function () {
            alert("Your opponent has left the game.");
            window.location.href = "/";
        });

        socket.on("game_cancelled", function (data) {
            alert(data.msg);
            window.location.href = "/";
        });
    });
</script>
{% endblock %}

{% block title %}
PvP
{% endblock %}

{% block main %}
<div class="container-fluid">
    <div id="status" class="d-flex justify-content-center align-items-center" style="height: 60vh;">
        <h2 class="text-highlight text-center">Connecting to a game...</h2>
    </div>

    <div id="game" class="hidden">
        <div class="row">
            <div class="col-lg-9 mb-4">
                <div class="chalk-card p-4 text-center">
                    <div class="d-flex justify-content-center align-items-center mb-4 flex-wrap gap-3">
                        <div class="fs-4 text-highlight uppercase" id="letters"></div>
                        <div id="timer" class="fs-1 fw-bold text-highlight px-4 py-2 border border-light rounded" style="min-width: 100px;">30</div>
                    </div>

                    <div class="mt-3">
                        <input id="word" autofocus autocomplete="off" placeholder="Type your word + Enter" type="text" class="form-control input-chalk text-center" style="max-width: 300px; margin: 0 auto;">
                    </div>
                    <div id="feedback" class="text-center mt-2 text-highlight"></div>
                </div>
            </div>

            <div class="col-lg-3">
                <div class="chalk-card p-3">
                    <h4 class="text-center">Live Summary</h4>
                    <div class="text-highlight text-center mb-2">Score: <span id="score">0</span></div>
                    <ul id="guessed_words" class="mt-3" style="list-style: none; padding-left: 0;"></ul>
                </div>
            </div> 
        </div>        
    </div>
</div>
<div id="summary" class="modal hidden">
    <div class="modal-content chalk-card text-light p-4">
        <h2 class="text-center mb-3">Summary</h2>
        <h4 class="text-center mb-4" id="summary-result"></h4>
        <p class="text-center fw-bold uppercase" id="summary-letters"></p>

        <div class="row mt-3">
            <div class="col-md-6">
                <h5>Your score: <span id="summary-your-score"></span></h5>
                <ul id="summary-words" style="list-style: none; padding-left: 0;"></ul>
            </div>
            <div class="col-md-6">
                <h5>Opponent's score: <span id="summary-opponent-score"></span></h5>
                <ul id="summary-opponent-words" style="list-style: none; padding-left: 0;"></ul>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="1v1" class="button-chalk">Play again</a>
            <a href="/" class="button-chalk">Main menu</a>
        </div>
    </div>
</div>

{% endblock %}
